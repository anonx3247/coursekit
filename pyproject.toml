[project]
name = "coursekit"
version = "0.1.0"
description = "Local YouTube course companion: transcripts, AI notes, a focused player, and an MCP server for Claude."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "yt-dlp[default]>=2025.11.12",
  "mcp>=2.3",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
ck = "coursekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursekit"]
